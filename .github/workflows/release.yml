name: Release
# Builds the program for Windows, macOS and Linux.
# - On a pull request: builds only (the downloads are attached to the run), to prove the build works.
# - Run by hand (Actions -> Release -> Run workflow) or on a pushed tag v*: also publishes a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to publish (created if missing)"
        required: true
        default: v0.0.3
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "tools/build.py", "tools/installer.iss", "requirements*.txt", "app.py"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Inno Setup, which makes the installer (Windows)
        if: runner.os == 'Windows'
        run: choco upgrade innosetup --yes --no-progress
      - run: pip install -r requirements.txt -r requirements-build.txt
      - name: Core tests
        run: python -m unittest discover tests
      - name: Build
        run: python tools/build.py
      - name: The built program makes every window (self-test)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            Windows) exe="dist/Stream Scheduler/Stream Scheduler.exe" ;;
            macOS)   exe="dist/Stream Scheduler.app/Contents/MacOS/Stream Scheduler" ;;
            *)       exe="dist/Stream Scheduler/Stream Scheduler" ;;
          esac
          "$exe" --uitest
      - name: The installer installs, the installed program runs, and it uninstalls (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $quiet = "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          $dir = "$env:LOCALAPPDATA\Programs\Stream Scheduler"
          $exe = "$dir\Stream Scheduler.exe"
          $run = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          $p = Start-Process "dist\Stream-Scheduler-Windows-Setup.exe" -ArgumentList $quiet -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installer failed: $($p.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "not installed in $dir" }
          $start = (Get-ItemProperty $run)."Stream Scheduler"
          if ($start -ne "`"$exe`" --tray") { throw "start at sign-in is not set: $start" }
          $p = Start-Process $exe -ArgumentList "--uitest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the installed program failed its self-test: $($p.ExitCode)" }
          # a running copy must not stop an update: start one, then install over it
          Start-Process $exe -ArgumentList "--tray"
          Start-Sleep 10
          $p = Start-Process "dist\Stream-Scheduler-Windows-Setup.exe" -ArgumentList $quiet -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installing over a running copy failed: $($p.ExitCode)" }
          if (Get-Process "Stream Scheduler" -ErrorAction SilentlyContinue) { throw "the running copy was not stopped" }
          Start-Process "$dir\unins000.exe" -ArgumentList $quiet -Wait
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep 1 }
          if (Test-Path $exe) { throw "not uninstalled" }
          if ((Get-ItemProperty $run)."Stream Scheduler") { throw "start at sign-in was left behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: download-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l downloads
          gh release create "$TAG" downloads/* --target "$GITHUB_SHA" --prerelease \
            --title "Stream Scheduler $TAG (alpha)" --notes-file .github/RELEASE_NOTES.md
