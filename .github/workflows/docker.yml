name: Docker
# Builds the container image (Dockerfile) and checks that the app works in it.
# - On a pull request that changes it: build and check only.
# - On a pushed tag v*, or run by hand: also publish ghcr.io/leaven-labs/stream-scheduler with the
#   version and :latest.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "docker/**", "requirements.txt", ".github/workflows/docker.yml"]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t stream-scheduler:ci .
      - name: Every window, off screen, in the image
        run: >
          docker run --rm --entrypoint sh -e QT_QPA_PLATFORM=offscreen -w /opt/stream-scheduler stream-scheduler:ci
          -c "/opt/venv/bin/python app.py --uitest && /opt/venv/bin/python -m unittest discover tests"
      - name: Starts, with its keyring unlocked
        run: |
          docker run -d --name ss -e KEYRING_PASSWORD=ci-only -e WEB_AUTHENTICATION_USERNAME=ci \
            -e WEB_AUTHENTICATION_PASSWORD=ci-only stream-scheduler:ci
          for i in $(seq 1 30); do docker exec ss pgrep -f "python app.py" && break; sleep 2; done
          sleep 5
          docker exec ss pgrep -f "python app.py" || { docker logs ss; exit 1; }
          docker rm -f ss
      - name: Does not start without the login page
        run: |
          docker run -d --name nologin -e KEYRING_PASSWORD=ci-only stream-scheduler:ci
          sleep 10
          docker logs nologin 2>&1 | grep "opens only behind the WebUI's login page"
          test "$(docker inspect -f '{{.State.Running}}' nologin)" = false
          docker rm -f nologin
      - name: Publish
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/leaven-labs/stream-scheduler
          version=$(docker run --rm --entrypoint /opt/venv/bin/python -w /opt/stream-scheduler stream-scheduler:ci -c "import paths; print(paths.VERSION)")
          for tag in "$version" latest; do
            docker tag stream-scheduler:ci "$image:$tag"
            docker push "$image:$tag"
          done
